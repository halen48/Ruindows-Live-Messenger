<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ruindows Live Messenger</title>
<link rel="stylesheet" href="css/msn.css">
<link rel="stylesheet" href="css/wlm85.css">
<script src="js/theme.js"></script>
<style>
  .wlm-window.buddy { background: #ecf6f9; }

  /* --- coloured header: title, identity, toolbar ------------------------- */
  .identity {
    flex: none;
    height: 112px;
    background: url('assets/wlm85/header.png') top / 100% 180px no-repeat;
    color: #fff;
  }
  .identity .wlm-titlebar .title-text { color: #fff; text-shadow: 0 1px 2px rgba(0, 40, 70, 0.7); }
  .me {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 8px 0 4px;
  }
  .me .wlm-dp { width: 80px; height: 80px; }
  .me .wlm-dp .frame { width: 80px; height: 80px; }
  .me .wlm-dp .pic { left: 6px; top: 5px; width: 64px; height: 64px; }
  .me-lines { min-width: 0; flex: 1; }
  .me-name {
    display: flex;
    align-items: baseline;
    gap: 5px;
    white-space: nowrap;
    -webkit-app-region: no-drag;
    cursor: pointer;
  }
  .me-name b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0, 40, 70, 0.6); }
  .me-name .st { color: #c4e6f2; }
  .me-name .wlm-dropdown::after, .psm.wlm-dropdown::after { border-top-color: #fff; }
  .psm {
    margin-top: 5px;
    color: #c4e6f2;
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .psm span { overflow: hidden; text-overflow: ellipsis; }
  .psm, .me .wlm-dp { -webkit-app-region: no-drag; cursor: pointer; }
  .psm:hover span, .me-name:hover b { text-decoration: underline; }
  .inline-edit {
    width: 100%;
    height: 20px;
    padding: 0 4px;
    border: 1px solid #7aa7c7;
    font-size: 12px;
    color: #1e1e1e;
    -webkit-app-region: no-drag;
  }

  .toolbar {
    flex: none;
    height: 30px;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 0 6px 0 8px;
    background: url('assets/wlm85/header.png') bottom / 100% 78px no-repeat;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    position: relative;
    z-index: 1;
  }
  .tb {
    height: 24px;
    min-width: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 0 3px;
    border: 1px solid transparent;
    border-radius: 3px;
    color: #fff;
  }
  .tb:hover { border-color: rgba(255, 255, 255, 0.55); background: rgba(255, 255, 255, 0.18); }
  .tb img { width: 16px; height: 16px; }
  .tb .caret { border: 3px solid transparent; border-top: 4px solid #fff; margin-top: 4px; }
  .toolbar .spacer { flex: 1; }

  /* --- contact pane with tab strip on the left ------------------------------- */
  .pane { flex: 1; min-height: 0; display: flex; }
  .tabs {
    flex: none;
    width: 34px;
    padding-top: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: #ecf6f9;
  }
  .tabs .tab {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid transparent;
    border-radius: 3px;
  }
  .tabs .tab.active { background: #fff; border-color: #bed6e0; border-right-color: #fff; border-radius: 3px 0 0 3px; margin-right: -2px; width: 32px; }
  .tabs .tab img { width: 22px; height: 19px; }

  .contacts {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1px solid #bed6e0;
    border-right: none;
  }
  .search-row {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 6px 6px 6px;
    border-bottom: 1px solid #e3e8ec;
  }
  .search {
    flex: 1;
    min-width: 0;
    height: 22px;
    display: flex;
    align-items: center;
    border: 1px solid #c4cdd6;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
    background: #fff;
  }
  .search input[type='text'] {
    flex: 1;
    min-width: 0;
    border: none;
    font-family: var(--wlm-font);
    font-size: 12px;
    padding: 0 5px;
    color: #1e1e1e;
  }
  .search input::placeholder { color: #8d8d8d; font-style: italic; }
  .search svg { flex: none; margin-right: 5px; }
  .icon-btn { display: flex; padding: 2px; border: 1px solid transparent; border-radius: 2px; }
  .icon-btn:hover { border-color: #a9cfe8; background: #eaf5fc; }

  .contact-list { flex: 1; overflow-y: auto; padding: 3px 0 6px; }

  /* Vista progress bar while WhatsApp syncs */
  .sync { flex: none; padding: 5px 8px 6px; border-bottom: 1px solid #e3e8ec; color: #4a4a4a; }
  .sync-bar {
    position: relative;
    height: 14px;
    margin-top: 4px;
    border: 1px solid #b2b2b2;
    border-radius: 3px;
    background: linear-gradient(180deg, #f3f3f3, #e2e2e2 50%, #d9d9d9 50%, #ececec);
    overflow: hidden;
  }
  .sync-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 0;
    background: linear-gradient(180deg, #a6eaa9 0%, #45c34e 45%, #06b025 50%, #3fd34b 100%);
    transition: width 0.4s;
  }
  /* transform-only and slow: animating "left" repainted the window every frame */
  .sync-bar.indeterminate .sync-fill { width: 30%; left: 0; will-change: transform; animation: sync-slide 2s steps(24) infinite; }
  @keyframes sync-slide { from { transform: translateX(-100%); } to { transform: translateX(334%); } }
  #sync[hidden] .sync-fill { animation: none; }
  .group-header {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 6px 2px;
    font-weight: 600;
    color: #1e1e1e;
  }
  .group-header img { width: 9px; height: 9px; }
  .group-header .count { font-weight: 400; color: #5a5a5a; }
  .contact-row {
    display: flex;
    align-items: center;
    gap: 4px;
    margin: 0 4px 0 14px;
    padding: 1px 4px;
    border: 1px solid transparent;
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
  }
  .contact-row:hover { background: linear-gradient(180deg, #fafdfe, #e8f5fd); border-color: #b8e2fb; }
  .contact-row.selected { background: linear-gradient(180deg, #f1f8fd, #d5effc); border-color: #84acdd; }
  .contact-row img { flex: none; width: 16px; height: 16px; }
  /* small network badge (WhatsApp/Telegram/...) so the same person on
     different networks is told apart at a glance */
  .pic-wrap { position: relative; flex: none; width: 16px; height: 16px; display: inline-block; }
  .pic-wrap .net-badge { position: absolute; right: -4px; bottom: -4px; width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff; }
  html[data-theme='dark'] .pic-wrap .net-badge { box-shadow: 0 0 0 1.5px #2b2d31; }
  .contact-row .cname { overflow: hidden; text-overflow: ellipsis; color: #1e1e1e; }
  .contact-row .status-suffix { color: #6d6d6d; }
  .contact-row .unread { color: #d35400; font-weight: 600; }
  .contact-row .personal-message { color: #8d8d8d; font-style: normal; }
  .fav-star.head { width: 13px; height: 13px; margin: 0 -1px 0 0; flex: none; }
  .contact-row .personal-message .emo { width: 16px; height: 16px; vertical-align: -3px; }
  .empty-note { padding: 2px 6px 2px 20px; color: #8d8d8d; }

  /* --- bottom: banner + web search ------------------------------------------- */
  .bottom { flex: none; padding: 8px 8px 7px; }
  .banner { display: flex; justify-content: center; margin-bottom: 7px; }
  .banner img { width: 234px; height: 60px; border: 1px solid #bed6e0; }
  .websearch {
    display: flex;
    height: 23px;
    border: 1px solid #a4b4c6;
    background: #fff;
  }
  .websearch input[type='text'] { flex: 1; min-width: 0; border: none; padding: 0 5px; font-family: var(--wlm-font); }
  .websearch input::placeholder { color: #8d8d8d; }
  .websearch button {
    width: 26px;
    border: none;
    border-left: 1px solid #a4b4c6;
    background: linear-gradient(180deg, #f6fbf2, #d7ecc9);
    display: flex;
    align-items: center;
    justify-content: center;
  }

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="favg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a0"/><stop offset=".55" stop-color="#ffd02a"/><stop offset="1" stop-color="#f0a800"/></linearGradient></defs></svg>
<div class="wlm-window buddy">
  <div class="identity" id="identity">
    <div class="wlm-titlebar">
      <img class="title-icon" src="assets/wlm85/live-flag.png" alt="" style="width:14px">
      <div class="title-text">Ruindows Live Messenger</div>
    </div>
    <div class="me">
      <div class="wlm-dp" id="myDpBox" title="Alterar foto de exibição">
        <img class="pic" id="myDp" src="assets/wlm85/avatar-default.png" alt="">
        <img class="frame" id="myFrame" src="assets/wlm85/frame-online.png" alt="">
      </div>
      <div class="me-lines">
        <div class="me-name" id="myName"><b id="myNameText">&hellip;</b><span class="st" id="myStatus">(Online)</span><span class="wlm-dropdown"></span></div>
        <div class="psm" id="psm"><span id="psmText">&lt;Digite uma mensagem pessoal&gt;</span></div>
      </div>
    </div>
  </div>
  <div class="wlm-caption">
    <button class="minimize" title="Minimizar"><svg class="glyph" width="10" height="5"><rect x="0.5" y="1.5" width="9" height="3" fill="#fff" stroke="#384c66"/></svg></button>
    <button class="maximize" title="Maximizar"><svg class="glyph" width="11" height="9"><rect x="0.5" y="0.5" width="10" height="8" fill="none" stroke="#384c66"/><rect x="1.5" y="1.5" width="8" height="6" fill="none" stroke="#fff"/><rect x="2.5" y="3.5" width="6" height="3" fill="#cfdbe8" stroke="#384c66"/></svg></button>
    <button class="close" title="Fechar"><svg class="glyph" width="12" height="10"><path d="M2 1.5l8 7M10 1.5l-8 7" stroke="#5a1a0c" stroke-width="3.2" stroke-linecap="round"/><path d="M2 1.5l8 7M10 1.5l-8 7" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>

  <div class="toolbar">
    <div class="tb" id="mailBtn" title="Abrir sua caixa de entrada"><img src="assets/wlm85/navbar-mail.png" alt=""></div>
    <div class="tb" id="contactsBtn" title="Localizar um contato"><img src="assets/wlm85/navbar-contacts.png" alt="" style="width:20px;height:20px"></div>
    <div class="tb" id="newsBtn" title="MSN Hoje"><img src="assets/wlm85/navbar-news.png" alt=""></div>
    <div class="spacer"></div>
    <div class="tb" id="themeBtn" title="Modo escuro"></div>
    <div class="tb" id="colorsBtn" title="Mudar o esquema de cores"><img src="assets/wlm85/navbar-colors.png" alt=""></div>
    <div class="tb" id="menuBtn" title="Mostrar menu"><svg width="14" height="12"><rect x="0.5" y="0.5" width="13" height="11" fill="#e8f1f6" stroke="#fff"/><path d="M3 3.5h8M3 6h8M3 8.5h8" stroke="#2d6d8f"/></svg><span class="caret"></span></div>
  </div>


  <div class="pane">
    <div class="tabs">
      <div class="tab active" title="Contatos"><img src="assets/wlm85/tab-contacts.png" alt=""></div>
    </div>
    <div class="contacts">
      <div class="search-row">
        <div class="search">
          <input type="text" id="findInput" placeholder="Localizar um contato..." spellcheck="false">
          <svg width="12" height="12"><circle cx="5" cy="5" r="3.8" fill="none" stroke="#6b7c8f" stroke-width="1.4"/><path d="M8 8l3 3" stroke="#6b7c8f" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div class="icon-btn" id="addBtn" title="Adicionar um contato ou uma IA"><img src="assets/wlm85/add-contact.png" width="16" height="15" alt=""></div>
        <div class="icon-btn" id="sortBtn" title="Organizar contatos"><img src="assets/wlm85/sort-contacts.png" width="16" height="16" alt=""></div>
      </div>
      <div class="sync" id="sync" hidden>
        <span id="syncLabel"></span> <span id="syncPct"></span>
        <div class="sync-bar" id="syncBar"><div class="sync-fill" id="syncFill"></div></div>
      </div>
      <div class="contact-list" id="contactList"></div>
    </div>
  </div>

  <div class="bottom">
    <div class="banner"><img src="assets/wlm85/ad.png" alt="Ruindows Live Messenger"></div>
    <form class="websearch" id="webSearch">
      <input type="text" id="webQuery" placeholder="Pesquisar na Web..." spellcheck="false">
      <button type="submit" title="Pesquisar"><svg width="12" height="12"><circle cx="5" cy="5" r="3.8" fill="none" stroke="#3d7a2a" stroke-width="1.5"/><path d="M8 8l3 3" stroke="#3d7a2a" stroke-width="2" stroke-linecap="round"/></svg></button>
    </form>
  </div>
</div>

<script src="js/chrome.js"></script>
<script src="js/menus.js"></script>
<script src="js/sounds.js"></script>
<script src="js/profile.js"></script>
<script src="js/activity.js"></script>
<script src="js/emoticons.js"></script>
<script>
  const listEl = document.getElementById('contactList');
  const myNameEl = document.getElementById('myName');
  const myStatusEl = document.getElementById('myStatus');
  const findInput = document.getElementById('findInput');
  const presenceByJid = new Map();
  let lastRoster = null;
  let selectedJid = null;

  const storage = {
    get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
  };
  // archived chats start folded away, like WhatsApp
  const collapsed = new Set(storage.get('collapsedGroups', ['archived']));
  let sortByName = storage.get('sortAlpha', true); // alphabetical by default

  // ---- colour schemes and custom header image (the paintbrush) -------------
  const SCHEMES = [['', 'Azul'], ['-green', 'Verde'], ['-pink', 'Rosa'], ['-yellow', 'Amarelo']];
  let scheme = storage.get('colorScheme', 0);
  function applyScheme() {
    const identity = document.getElementById('identity');
    const toolbar = document.querySelector('.toolbar');
    const custom = Profile.get().header;
    if (custom) {
      // darken it a little so the white name and icons stay readable
      identity.style.background = `linear-gradient(rgba(0, 30, 60, 0.15), rgba(0, 30, 60, 0.35)), url('${custom}') center top / cover no-repeat`;
      toolbar.style.background = `linear-gradient(rgba(0, 30, 60, 0.55), rgba(0, 30, 60, 0.65)), url('${custom}') center bottom / cover no-repeat`;
    } else {
      identity.style.background = '';
      toolbar.style.background = '';
      const url = `url('assets/wlm85/header${SCHEMES[scheme][0]}.png')`;
      identity.style.backgroundImage = url;
      toolbar.style.backgroundImage = url;
    }
  }
  applyScheme();
  document.getElementById('colorsBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const r = e.currentTarget.getBoundingClientRect();
    const custom = !!Profile.get().header;
    Menus.popup([
      ...SCHEMES.map(([, label], i) => ({
        label: (!custom && i === scheme ? '✓ ' : '') + label,
        action: () => { scheme = i; storage.set('colorScheme', i); Profile.set({ header: null }); },
      })),
      { sep: true },
      { label: (custom ? '✓ ' : '') + 'Escolher uma imagem...', action: async () => {
        const img = await Profile.pickImage(660, 284);
        if (img) Profile.set({ header: img });
      } },
    ], r.right - 190, r.bottom + 2);
  });

  function statusOf(chat) {
    return Activity.statusOf({
      presence: presenceByJid.get(chat.jid) || chat.presence,
      lastIncoming: chat.lastIncoming,
      about: chat.about,
      lastOutgoing: chat.lastOutgoing,
      directIncoming: chat.directIncoming,
    });
  }
  // statuses decay with time, so redraw every minute
  setInterval(() => lastRoster && render(lastRoster), 60 * 1000);

  function icon(status) {
    return {
      online: 'assets/wlm85/status16-online.png',
      away: 'assets/wlm85/status16-away.png',
      busy: 'assets/wlm85/status16-busy.png',
      offline: 'assets/wlm85/status16-invisible.png',
    }[status];
  }

  // gold star in front of the Favoritos header
  // little robot on the AI sections' headers, the way Favoritos has its star
  const ROBOT_SVG = '<svg class="fav-star head" viewBox="0 0 12 12" width="12" height="12"><path d="M6 .8v1.6" stroke="#6b7f95" stroke-width=".9"/><circle cx="6" cy=".9" r=".8" fill="#e8463a"/><rect x="1.8" y="2.6" width="8.4" height="6.6" rx="1.6" fill="#cfdbe8" stroke="#56708c" stroke-width=".8"/><circle cx="4.3" cy="5.6" r="1.05" fill="#2f9be0"/><circle cx="7.7" cy="5.6" r="1.05" fill="#2f9be0"/><path d="M4.4 7.7h3.2" stroke="#56708c" stroke-width=".7"/><path d="M.9 4.7v2.4M11.1 4.7v2.4" stroke="#56708c" stroke-width=".9"/><path d="M3.6 9.2v1.6h4.8V9.2" fill="#b4c4d6" stroke="#56708c" stroke-width=".7"/></svg>';
  const STAR_SVG = '<svg class="fav-star" viewBox="0 0 12 12" width="11" height="11"><path d="M6 .6l1.6 3.4 3.7.4-2.8 2.5.8 3.7L6 8.7 2.7 10.6l.8-3.7L.7 4.4l3.7-.4z" fill="url(#favg)" stroke="#c98a00" stroke-width=".7"/></svg>';

  // which network a chat comes from, and its badge
  const NET_BADGE = {
    whatsapp: 'assets/net/whatsapp.svg',
    telegram: 'assets/net/telegram.svg',
  };
  function picWithBadge(img, source) {
    const badge = NET_BADGE[source || 'whatsapp'];
    const b = badge ? `<img class="net-badge" src="${badge}" alt="${source || 'whatsapp'}" title="${source || 'WhatsApp'}">` : '';
    return `<span class="pic-wrap"><img src="${img}">${b}</span>`;
  }

  function row(chat) {
    if (chat.isMe) return myRow(chat);
    const div = document.createElement('div');
    div.className = 'contact-row' + (chat.jid === selectedJid ? ' selected' : '');
    if (!chat.isGroup) div.title = '+' + chat.jid.replace(/@.*/, '');
    const status = statusOf(chat);
    const suffix =
      status === 'online' || chat.isGroup
        ? ''
        : status === 'away'
          ? ' <span class="status-suffix">(Ausente)</span>'
          : status === 'busy'
          ? ' <span class="status-suffix">(Ocupado)</span>'
          : ' <span class="status-suffix">(Offline)</span>';
    const unread = chat.unread > 0 ? ` <span class="unread">(${chat.unread})</span>` : '';
    // personal message = their WhatsApp "about" text, never the last message
    const psm = chat.about
      ? ` <span class="personal-message">- ${messageHtml(truncate(chat.about, 48))}</span>`
      : '';
    const img = chat.isGroup ? 'assets/wlm85/messenger-icon.png' : icon(status);
    div.innerHTML = `${picWithBadge(img, chat.source)}<span class="cname">${escapeHtml(chat.name)}${suffix}${unread}${psm}</span>`;
    div.addEventListener('dblclick', () => window.msn.openChat(chat.jid));
    div.addEventListener('click', () => selectRow(div, chat.jid));
    div.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      selectRow(div, chat.jid);
      Menus.popup(
        [
          { label: 'Enviar uma mensagem instantânea', action: () => window.msn.openChat(chat.jid) },
          { label: 'Chamar a atenção', action: () => window.msn.nudge(chat.jid) },
          { sep: true },
          { label: 'Exibir perfil', action: () => showProfile(chat) },
          { sep: true },
          { label: 'Bloquear', disabled: true },
          { label: 'Excluir contato', disabled: true },
        ],
        e.clientX,
        e.clientY
      );
    });
    return div;
  }

  // me, at the top of the list, to message myself like WhatsApp's "Você"
  // Volto logo and Saí para almoçar used the away icon in 8.5, Ao telefone the busy one
  const MY_ICON = { online: 'status16-online', busy: 'status16-busy', brb: 'status16-away', away: 'status16-away', phone: 'status16-busy', lunch: 'status16-away', offline: 'status16-invisible' };
  function myRow(chat) {
    const div = document.createElement('div');
    div.className = 'contact-row' + (chat.jid === selectedJid ? ' selected' : '');
    const p = Profile.get();
    const psm = p.psm ? ` <span class="personal-message">- ${escapeHtml(truncate(p.psm, 40))}</span>` : '';
    const unread = chat.unread > 0 ? ` <span class="unread">(${chat.unread})</span>` : '';
    div.innerHTML = `<img src="assets/wlm85/${MY_ICON[myStatus] || MY_ICON.online}.png">` +
      `<span class="cname">${escapeHtml(p.nick || waName)} <span class="status-suffix">(você)</span>${unread}${psm}</span>`;
    div.title = 'Mensagens para você mesmo';
    div.addEventListener('dblclick', () => window.msn.openChat(chat.jid));
    div.addEventListener('click', () => selectRow(div, chat.jid));
    return div;
  }

  function selectRow(div, jid) {
    selectedJid = jid;
    document.querySelectorAll('.contact-row.selected').forEach((r) => r.classList.remove('selected'));
    div.classList.add('selected');
  }

  function statusLabel(chat) {
    return { online: 'Online', busy: 'Ocupado', away: 'Ausente', offline: 'Offline' }[statusOf(chat)];
  }

  function showProfile(chat) {
    const overlay = document.createElement('div');
    overlay.className = 'xp-dialog-overlay';
    overlay.innerHTML = `
      <div class="xp-dialog">
        <div class="xp-dialog-title">${escapeHtml(chat.name)}</div>
        <div class="xp-dialog-body">
          <div class="wlm-dp small"><img class="pic" id="profDp" src="assets/wlm85/avatar-default.png"><img class="frame" src="assets/wlm85/frame_64.png"></div>
          <div>
            <b>${escapeHtml(chat.name)}</b><br>
            +${escapeHtml(chat.jid.replace(/@.*/, ''))}<br>
            Status: ${statusLabel(chat)}
          </div>
        </div>
        <div class="xp-dialog-buttons"><button class="wlm-button">Fechar</button></div>
      </div>`;
    overlay.querySelector('button').addEventListener('click', () => overlay.remove());

    window.msn.avatar(chat.jid).then((url) => {
      const img = overlay.querySelector('#profDp');
      if (url && img) img.src = url;
    });

  function groupHeader(key, label, count) {
    const div = document.createElement('div');
    div.className = 'group-header';
    const arrow = collapsed.has(key) ? 'arrow-left' : 'arrow-down';
    const star = key === 'pinned' ? STAR_SVG.replace('fav-star', 'fav-star head') : key.startsWith('ai-') ? ROBOT_SVG : '';
    div.innerHTML = `<img src="assets/wlm85/${arrow}.png" alt="">${star}${label} <span class="count">(${count})</span>`;
    div.addEventListener('click', () => {
      collapsed.has(key) ? collapsed.delete(key) : collapsed.add(key);
      storage.set('collapsedGroups', [...collapsed]);
      if (lastRoster) render(lastRoster);
    });
    return div;
  }

  // Redrawing ~900 rows on every WhatsApp event (each "typing" in any group)
  // kept the CPU busy and made the whole desktop, mouse included, sluggish.
  // Coalesce into at most a few redraws per second, and none while minimized.
  let renderTimer = null;
  let lastRenderAt = 0;
  function render(roster) {
    lastRoster = roster;
    if (renderTimer) return;
    const wait = Math.max(0, 700 - (Date.now() - lastRenderAt));
    renderTimer = setTimeout(() => {
      renderTimer = null;
      if (document.hidden) { pendingWhileHidden = true; return; }
      lastRenderAt = Date.now();
      renderNow(lastRoster);
    }, wait);
  }
  let pendingWhileHidden = false;
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && pendingWhileHidden && lastRoster) { pendingWhileHidden = false; render(lastRoster); }
  });
  const byName = new Intl.Collator('pt-BR', { sensitivity: 'base', numeric: true });

  function renderNow(roster) {
    if (roster.me && roster.me.name !== waName) {
      waName = roster.me.name;
      applyProfile();
    }
    if (roster.me) loadMyDp(roster.me.jid);
    const q = findInput.value.trim().toLowerCase();
    let chats = roster.chats.filter((c) => !q || c.name.toLowerCase().includes(q));
    if (sortByName) chats = [...chats].sort((a, b) => byName.compare(a.name, b.name));
    const archived = chats.filter((c) => c.archived && !c.isMe);
    // chats pinned on WhatsApp live only in Favoritos, at the top
    const pinned = chats.filter((c) => c.pinned && !c.archived);
    const me = chats.find((c) => c.isMe && !c.pinned);
    chats = chats.filter((c) => !c.archived && !c.isMe && !c.pinned);
    const sections = [
      ['pinned', 'Favoritos', pinned],
      ['online', 'Online', [...(me ? [me] : []), ...chats.filter((c) => !c.isGroup && statusOf(c) !== 'offline')]],
      ['groups', 'Grupos', chats.filter((c) => c.isGroup)],
      ['offline', 'Offline', chats.filter((c) => !c.isGroup && statusOf(c) === 'offline')],
      ['archived', 'Arquivadas', archived],
    ];
    listEl.replaceChildren();
    for (const [key, label, list] of sections) {
      if (key === 'archived') renderAi(q);
      if ((key === 'groups' || key === 'archived' || key === 'pinned') && !list.length) continue;
      listEl.appendChild(groupHeader(key, label, list.length));
      if (!collapsed.has(key)) list.forEach((c) => listEl.appendChild(row(c)));
    }
    if (q && !chats.length && !archived.length && !pinned.length) {
      listEl.appendChild(Object.assign(document.createElement('div'), {
        className: 'empty-note',
        textContent: 'Nenhum contato encontrado.',
      }));
    }
  }

  // ---- AI chat sites: one section per provider ------------------------------------
  let aiRoster = [];
  window.msn.aiRoster?.().then((r) => { aiRoster = r || []; if (lastRoster) render(lastRoster); });
  window.msn.onAiRoster?.((r) => { aiRoster = r || []; if (lastRoster) render(lastRoster); });

  function aiRow(text, { icon = 'assets/wlm85/messenger-icon.png', title, dim, onOpen, jid, sub, single } = {}) {
    const div = document.createElement('div');
    div.className = 'contact-row ai-row' + (jid && jid === selectedJid ? ' selected' : '');
    div.innerHTML = `<img src="${icon}"><span class="cname${dim ? ' status-suffix' : ''}">${escapeHtml(text)}` +
      `${sub ? ` <span class="personal-message">- ${escapeHtml(sub)}</span>` : ''}</span>`;
    if (title) div.title = title;
    div.addEventListener('dblclick', onOpen);
    // actions like "Entrar no ..." work with one click
    div.addEventListener('click', () => (single ? onOpen() : jid ? selectRow(div, jid) : null));
    return div;
  }

  // signing in: the login I already have in Firefox (the only way Google
  // works), or the site itself (e-mail/password)
  function aiLoginMenu(prov, e) {

  function renderAi(q) {
    renderAiGroups(q);
    const match = (t) => !q || t.toLowerCase().includes(q);
    for (const prov of aiRoster) {
      const key = `ai-${prov.id}`;
      const convs = prov.conversations.filter((c) => match(c.title) || match(prov.name));
      // Claude Code sessions on this PC, shown under Claude
      const code = (prov.codeSessions || []).filter((c) => match(c.title) || match(prov.name) || match('claude code'));
      if (q && !convs.length && !code.length && !match(prov.name)) continue;
      const header = groupHeader(key, prov.name, convs.length + code.length);
      header.title = 'Clique com o botão direito para mais opções';
      header.addEventListener('contextmenu', (e) => aiHeaderMenu(prov, e));
      listEl.appendChild(header);
      if (collapsed.has(key)) continue;
      if (!prov.checked) {
        listEl.appendChild(aiRow('Conectando...', { icon: 'assets/wlm85/status16-away.png', dim: true, onOpen: () => window.msn.aiLogin(prov.id) }));
      } else if (!prov.loggedIn) {
        const row = aiRow(`Entrar no ${prov.name}...`, { icon: 'assets/wlm85/status16-invisible.png', title: 'Usar o login do Firefox ou entrar pelo site' });
        row.addEventListener('click', (e) => aiLoginMenu(prov, e));
        listEl.appendChild(row);

        const starts = prov.models && prov.models.length

          : [{ sub: null, suffix: '' }];

          listEl.appendChild(aiRow(c.title, { jid: c.jid, sub: c.model, onOpen: () => window.msn.openChat(c.jid) }));

          sub: 'Claude Code',

          onOpen: () => window.msn.openChat(c.jid),

    }

  // ---- my profile: nick, personal message, picture (cosmetic only) --------

  function applyProfile() {

  function editInline(container, current, placeholder, save) {
    const input = Object.assign(document.createElement('input'), {
      type: 'text', className: 'inline-edit', value: current, placeholder,
    });
    const restore = container.innerHTML;
    container.replaceChildren(input);
    input.focus();
    input.select();
    let done = false;
    const finish = (commit) => {
      if (done) return;
      done = true;
      container.innerHTML = restore;
      if (commit) save(input.value.trim());
      applyProfile();
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
    input.addEventListener('click', (e) => e.stopPropagation());
  }

    editInline(document.getElementById('myName'), Profile.get().nick || waName, waName,
      (v) => Profile.set({ nick: v === waName ? null : v }));

  });

  // ---- toolbar ---------------------------------------------------------------
  document.getElementById('mailBtn').addEventListener('click', () =>
    window.msn.openExternal('https://outlook.live.com/mail/'));
  document.getElementById('newsBtn').addEventListener('click', () =>
    window.msn.openExternal('https://www.msn.com/pt-br'));
  document.getElementById('contactsBtn').addEventListener('click', () => findInput.focus());

  // 8.5 hid the classic menu bar behind this button
  document.getElementById('menuBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const r = e.currentTarget.getBoundingClientRect();
    Menus.popup([
      { label: 'Enviar uma mensagem instantânea', action: () => selectedJid && window.msn.openChat(selectedJid) },
      { label: 'Chamar a atenção', action: () => selectedJid && window.msn.nudge(selectedJid) },
      { sep: true },
      ...Object.entries(MY_STATUS).map(([st, [label]]) => ({
        label: 'Meu status: ' + label,
        icon: MY_STATUS_ICON(st),
        current: st === myStatus,
        action: () => setMyStatus(st),
      })),
      { label: 'Alterar nome de exibição...', action: editNick },
      { sep: true },
      { label: 'Opções de mídia...', action: mediaOptions },
      { label: 'Tema...', action: themeMenu },
      { label: 'Atualizar conversas das IAs', action: () => window.msn.aiRefresh() },
      { sep: true },
      {
        label: (quietArchived ? '✓ ' : '') + 'Grupos arquivados não abrem janela',
        action: () => { quietArchived = !quietArchived; window.msn.setOption('quietArchivedGroups', quietArchived); },
      },
      { sep: true },
      { label: 'Sobre o Ruindows Live Messenger', action: () => Menus.showAbout() },
      { sep: true },
      { label: 'Sair', action: () => window.msn.signOut() },
      { label: 'Fechar', action: () => window.msn.close() },
    ], r.right - 200, r.bottom + 2);
  });

  // archived groups stay quiet (no window/toast); off by default
  let quietArchived = false;
  window.msn.getOption?.('quietArchivedGroups').then((v) => { quietArchived = !!v; });

  // ---- search, sort, add ---------------------------------------------------------
  findInput.addEventListener('input', () => lastRoster && render(lastRoster));
  findInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { findInput.value = ''; lastRoster && render(lastRoster); }
    if (e.key === 'Enter') listEl.querySelector('.contact-row')?.dispatchEvent(new MouseEvent('dblclick'));
  });
  document.getElementById('sortBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const r = e.currentTarget.getBoundingClientRect();
    const pick = (byName) => { sortByName = byName; storage.set('sortAlpha', byName); lastRoster && render(lastRoster); };
    Menus.popup([
      { label: (sortByName ? '' : '✓ ') + 'Conversa mais recente', action: () => pick(false) },
      { label: (sortByName ? '✓ ' : '') + 'Nome', action: () => pick(true) },
    ], r.right - 170, r.bottom + 2);
  });
  // one "add" button for everything: a WhatsApp number or an AI
  document.getElementById('addBtn').addEventListener('click', async (e) => {
    e.stopPropagation();
    const r = e.currentTarget.getBoundingClientRect();
    const providers = await window.msn.aiProviders();
    const on = new Set(aiRoster.map((p) => p.id));
    const ais = providers.filter((p) => !on.has(p.id));
    Menus.popup([
      { label: 'Adicionar contato do WhatsApp...', action: addPhoneContact },
      ...(ais.length ? [{ sep: true }] : []),
      ...ais.map((p) => ({ label: `Mostrar ${p.name} na lista`, action: () => setAiEnabled([...on, p.id]) })),
    ], r.left, r.bottom + 2);
  });
  function addPhoneContact() {
    const overlay = document.createElement('div');
    overlay.className = 'xp-dialog-overlay';
    overlay.innerHTML = `
      <form class="xp-dialog">
        <div class="xp-dialog-title">Adicionar um contato</div>
        <div class="xp-dialog-body" style="flex-direction:column;gap:6px">
          Número do celular com DDI e DDD:
          <input type="text" name="num" placeholder="5511999999999" style="width:200px;height:22px;padding:0 4px">
        </div>
        <div class="xp-dialog-buttons">
          <button class="wlm-button" type="submit">Conversar</button>
          <button class="wlm-button" type="button" data-cancel>Cancelar</button>
        </div>
      </form>`;
    const form = overlay.querySelector('form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const num = form.num.value.replace(/\D/g, '');
      if (num.length < 10) return;
      overlay.remove();
      window.msn.openChat(`${num}@s.whatsapp.net`);
    });
    overlay.querySelector('[data-cancel]').addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
    form.num.focus();
  }

  document.getElementById('webSearch').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = document.getElementById('webQuery').value.trim();
    if (q) window.msn.openExternal('https://www.bing.com/search?q=' + encodeURIComponent(q));
  });

  // ---- live events -------------------------------------------------------------
  window.msn.onRoster(render);
  window.msn.onPresence(({ jid: chatJid, presence, participant }) => {
    // typing inside a group says something about that person, not the group
    const jid = participant || chatJid;
    const wasOnline = presenceByJid.get(jid) === 'available';
    presenceByJid.set(jid, presence);
    if (!wasOnline && presence === 'available') { try { Sounds.online(); } catch {} }
    const wasShownOnline = wasOnline || presenceByJid.get(jid + '#shown');
    const nowOnline = presence === 'available' || presence === 'composing' || presence === 'recording';
    presenceByJid.set(jid + '#shown', nowOnline);
    if (lastRoster && !!wasShownOnline !== nowOnline) render(lastRoster);
  });
  window.msn.onMessage((msg) => { if (!msg.fromMe && !msg.windowOpen) { try { Sounds.message(); } catch {} } });

  function showSync(state) {
    document.getElementById('sync').hidden = !state;
    if (!state) return;
    const known = typeof state.progress === 'number';
    document.getElementById('syncLabel').textContent = state.label;
    document.getElementById('syncPct').textContent = known ? `${Math.round(state.progress)}%` : '';
    document.getElementById('syncBar').classList.toggle('indeterminate', !known);
    document.getElementById('syncFill').style.width = known ? `${state.progress}%` : '';
  }
  window.msn.onSync(showSync);
  window.msn.getSync().then(showSync);

  window.msn.getRoster().then(render);
</script>
</body>
</html>
