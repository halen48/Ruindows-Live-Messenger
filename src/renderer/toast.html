<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="css/msn.css">
<link rel="stylesheet" href="css/wlm85.css">
<script src="js/theme.js"></script>
<style>
  body { background: transparent; }
  .toast {
    height: 100vh;
    display: flex;
    flex-direction: column;
    border: 1px solid #6d8099;
    border-radius: 5px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.85);
    background: linear-gradient(180deg, #cfe6f2 0px, #e9f4fa 22px, #ffffff 60%, #eef6fb 100%);
    overflow: hidden;
    cursor: pointer;
  }
  .header {
    flex: none;
    height: 22px;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 4px 0 6px;
    font-size: 11px;
    color: #2c3e52;
  }
  .header img { width: 16px; height: 14px; }
  .header .title { flex: 1; }
  .header .x {
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
  }
  .header .x:hover { background: #fff; box-shadow: 0 0 0 1px #9cb2c9; }
  .body {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px 4px 6px;
    min-height: 0;
  }
  .lines { min-width: 0; }
  .from { color: #1e1e1e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .text {
    margin-top: 2px;
    color: var(--wlm-link);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
</style>
</head>
<body>
<div class="toast" id="toast">
  <div class="header">
    <img src="assets/wlm85/messenger-icon.png" alt="">
    <span class="title">Ruindows Live Messenger</span>
    <span class="x" id="dismiss"><svg width="8" height="8"><path d="M1 1l6 6M7 1l-6 6" stroke="#4a4a4a" stroke-width="1.4"/></svg></span>
  </div>
  <div class="body">
    <div class="wlm-dp small">
      <img class="pic" id="pic" src="assets/wlm85/avatar-default.png" alt="">
      <img class="frame" src="assets/wlm85/frame_64.png" alt="">
    </div>
    <div class="lines">
      <div class="from"><span id="name"></span> diz:</div>
      <div class="text" id="text"></div>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('name').textContent = q.get('name') || '';
  document.getElementById('text').textContent = q.get('text') || '';
  window.msn.avatar(q.get('jid')).then((src) => {
    if (src) document.getElementById('pic').src = src;
  }).catch(() => {});
  document.getElementById('dismiss').addEventListener('click', (e) => {
    e.stopPropagation();
    window.close();
  });
  document.getElementById('toast').addEventListener('click', () => window.msn.toastClick(q.get('jid')));
</script>
</body>
</html>
